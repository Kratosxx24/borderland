<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Borderland — Name the Neighbours</title>
    <meta name="description" content="You're given a country. Name every nation that shares its border." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" id="meta-theme-color" content="#dfe6e9" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Borderland — Name the Neighbours" />
    <meta property="og:description" content="You're given a country. Name every nation that shares its border. A new challenge every day." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Borderland — Name the Neighbours" />
    <meta name="twitter:description" content="You're given a country. Name every nation that shares its border. A new challenge every day." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles.css?v=8" />
    <link rel="icon" type="image/png" href="./public/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="./public/apple-touch-icon.png?v=2" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <img class="brand-mark" src="./public/mark.png?v=2" alt="" width="256" height="256" />
          <div class="brand-text">
            <h1>Borderland</h1>
            <p class="brand-sub">An <b>Overland</b> Game</p>
          </div>
        </div>

        <section class="prompt">
          <p class="eyebrow" id="puzzle-label">Daily Challenge</p>
          <div class="prompt-route">
            <span class="endpoint" id="target-country">—</span>
          </div>
          <p class="prompt-meta" id="prompt-meta"></p>
        </section>

        <nav class="topbar-actions">
          <button type="button" class="ghost" data-act="how" aria-label="How to Play"><svg class="phone-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.4M12 16.8v.2" /></svg><span class="btn-text">How to Play</span></button>
          <button type="button" class="ghost" data-act="shuffle" aria-label="New Country"><svg class="phone-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3.5c4.5 0 5.5 10 10 10H20M4 17h3.5c1.6 0 2.7-1.3 3.6-3M20 7h-2.5c-1.6 0-2.7 1.3-3.6 3M17.5 4.5 20 7l-2.5 2.5M17.5 14.5 20 17l-2.5 2.5" /></svg><span class="btn-text">New Country</span></button>
          <button type="button" class="ghost" data-act="archive" aria-label="Archive"><svg class="phone-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="2" /><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4" /></svg><span class="btn-text">Archive</span></button>
          <button type="button" class="ghost icon" data-act="stats" aria-label="Statistics">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 20V11M12 20V4M19 20v-6" />
            </svg>
          </button>
          <button type="button" class="ghost icon" data-act="theme" aria-label="Switch theme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" /></svg>
          </button>
        </nav>
      </header>

      <main class="board">
        <div class="mapcard">
          <button type="button" class="mapmode" data-act="blind" aria-pressed="false">
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z" />
              <circle cx="12" cy="12" r="2.8" />
            </svg>
            <svg class="eye-shut" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 8.4C2.8 9.9 2 12 2 12s3.6 6.5 10 6.5c1.7 0 3.2-.5 4.5-1.1M9.9 6.1A11 11 0 0 1 12 5.5c6.4 0 10 6.5 10 6.5s-1 1.8-2.8 3.5" />
              <path d="M3 3l18 18" />
            </svg>
            <span class="mapmode-text">Borders Shown</span>
          </button>
          <button type="button" class="mapmode mapreset" data-act="recenter" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15" />
            </svg>
            <span>Reset View</span>
          </button>
          <div class="mapstage" id="stage"></div>
          <ul class="legend">
            <li><i class="swatch is-target"></i>Target Country</li>
            <li><i class="swatch is-found"></i>Neighbour Found</li>
            <li><i class="swatch is-wrong"></i>Not a Neighbour</li>
          </ul>
        </div>

        <aside class="panel">
          <form class="guessbox" id="guessform" autocomplete="off">
            <div class="field">
              <input
                id="guess"
                type="text"
                placeholder="Name a neighbour…"
                aria-label="Name a neighbour"
                spellcheck="false"
                autocapitalize="off"
              />
              <button type="submit" class="submit" aria-label="Submit guess">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M12 5l7 7-7 7" /></svg>
              </button>
            </div>
            <ul class="suggest" id="suggest" role="listbox" hidden></ul>
          </form>

          <p class="feedback" id="feedback" role="status" aria-live="polite"></p>

          <div class="tally">
            <div class="pips" id="pips" aria-hidden="true"></div>
            <span class="tally-text" id="tally">—</span>
            <button type="button" class="linky concede" data-act="concede" hidden>Give Up</button>
          </div>

          <ol class="guesses" id="guesses"></ol>
        </aside>
      </main>
    </div>

    <div class="sheet-scrim" id="scrim" hidden>
      <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <button type="button" class="sheet-close" data-act="close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
        <div id="sheet-body"></div>
      </section>
    </div>

    <script type="module" src="./src/main.js?v=4"></script>
  </body>
</html>
